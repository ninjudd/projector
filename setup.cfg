[metadata]
name = projector-cli
version = 0.1.0
description = Git-native project plans for people and coding agents
long_description = file: README.md
long_description_content_type = text/markdown
author = Justin Balthrop
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11
include_package_data = False

[options.packages.find]
where = src

[options.package_data]
projector =
    templates/*.md

[options.entry_points]
console_scripts =
    project = projector.cli:main
