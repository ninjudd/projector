name: Projector site
description: Build the Projector site from the content Projector keeps in the repository, its README, docs and project plans and the walkthroughs under refs/projector/walkthroughs, and deploy it to GitHub Pages.
inputs:
  ref:
    description: The hidden ref holding <root>/<number>/<head>/spec.json files.
    default: refs/projector/walkthroughs
  root:
    description: Directory inside the ref that holds the specs.
    default: walkthroughs
  prepare:
    description: A shell command to run in the checkout before the build, to generate pages or files the repository does not commit, such as an HTML page or a WebAssembly module, in place of the repository's site.prepare setting. Set up any toolchain it needs in earlier steps.
    default: ''
outputs:
  page_url:
    description: The deployed site's URL.
    value: ${{ steps.deploy.outputs.page_url }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - name: Fetch the walkthrough specs
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        ROOT: ${{ inputs.root }}
      # A repository that has published no walkthrough yet has no ref to fetch,
      # and still gets a site of its README, docs and plans.
      run: |
        if git ls-remote --exit-code origin "$REF" >/dev/null; then
          git fetch --no-tags origin "+$REF:$REF"
          git worktree add --detach "$RUNNER_TEMP/walkthrough-specs" "$REF"
          echo "WALKTHROUGHS=$RUNNER_TEMP/walkthrough-specs/$ROOT" >> "$GITHUB_ENV"
        fi
    - id: pages
      uses: actions/configure-pages@v5
    - name: Build the Projector site
      shell: bash
      env:
        BASE: ${{ steps.pages.outputs.base_path }}
        GH_TOKEN: ${{ github.token }}
        PREPARE: ${{ inputs.prepare }}
        PYTHONPATH: ${{ github.action_path }}/../../src
      # -P keeps the caller's checkout, the working directory, off sys.path, so a
      # repository with its own top-level projector module cannot shadow this one.
      # --check-visibility fails the deploy when a private repository's site is
      # public, since the site copies the README, docs, plans and diffs into it.
      # --base is the path Pages serves the site under, /projector for a project
      # site, so every page can link to the others and to the shared assets.
      # The build runs the repository's site.prepare, or the prepare input in its
      # place, after this action's checkout, which removes untracked files, so
      # what the command generates is still there when the build copies it.
      run: |
        python3 -P -m projector site build --out "$RUNNER_TEMP/walkthrough-site" --check-visibility \
          --base "${BASE:-/}" --repo-root "$GITHUB_WORKSPACE" ${WALKTHROUGHS:+--walkthroughs "$WALKTHROUGHS"} \
          ${PREPARE:+--prepare "$PREPARE"}
    - uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ runner.temp }}/walkthrough-site
    - id: deploy
      uses: actions/deploy-pages@v4
