name: Projector review
description: Review a pull request's head with an agent and no session through `project review run`, or publish the summaries a run's reviews handed off, as docs/review-in-ci.md describes.
inputs:
  step:
    description: "`review` runs the agent. `summary` publishes the run's summary artifacts and runs no agent."
    default: review
  pr:
    description: The pull request to review.
    default: ${{ github.event.pull_request.number }}
  agent:
    description: "`claude`, `codex`, or `command`, which runs the command the repository's review.runner names."
    default: claude
  model:
    description: The model the agent runs, which names its review. Defaults to claude-opus-5-5 for claude; codex and command need one.
    default: ''
  effort:
    description: The reasoning effort the agent runs at.
    default: high
  permission-mode:
    description: "`auto` has the agent's own judgment decide what no rule covers; `allowlist` refuses it."
    default: auto
  rereview:
    description: Review a head this model already reviewed.
    default: 'false'
  config:
    description: TOML for $HOME/.projector.toml, where `[override.<priority>]` tables can replace a committed setting for CI, such as a review.gate step a runner cannot run.
    default: ''
  timeout-minutes:
    description: The agent's time limit. Give the job 15 minutes more.
    default: '45'
  claude-code-version:
    description: The version of Claude Code the claude agent runs.
    default: 2.1.327
  codex-version:
    description: The version of Codex the codex agent runs.
    default: 0.169.0
  app-id:
    description: Post the review as this GitHub App, with app-private-key. Empty posts as github-actions[bot].
    default: ''
  app-private-key:
    description: The private key of the app app-id names, from the PROJECTOR_APP_PRIVATE_KEY secret. Only the step that mints the app's token reads it.
    default: ''
  app:
    description: "`projector` posts the review as the hosted Projector service's app, with a token the service at hosted.url mints for the job's OIDC token, so no private key is involved. The job needs `id-token: write`. Leave app-id empty."
    default: ''
runs:
  using: composite
  steps:
    # Exactly one credential for the agent, so a review never draws on API credits that were meant to stay
    # unused when a subscription token is set too.
    - name: Check the agent's credentials
      if: inputs.step == 'review'
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
      run: |
        case "$AGENT" in
          claude) subscription=CLAUDE_CODE_OAUTH_TOKEN key=ANTHROPIC_API_KEY ;;
          codex) subscription=CODEX_AUTH_JSON key=OPENAI_API_KEY ;;
          command) exit 0 ;;
          *) echo "::error::agent $AGENT is not claude, codex, or command"; exit 1 ;;
        esac
        if [ -n "${!subscription:-}" ] && [ -n "${!key:-}" ]; then
          echo "::error::both $subscription and $key are set for $AGENT; delete the secret you do not mean to use"
          exit 1
        fi
        # A self-hosted runner can keep a Codex login of its own, which Codex refreshes in place.
        login="${CODEX_HOME:-$HOME/.codex}/auth.json"
        if [ "$AGENT" = codex ] && [ -z "${!subscription:-}" ] && [ -f "$login" ]; then
          if [ -n "${!key:-}" ]; then
            echo "::error::both $key and the Codex login in $login are on the runner; remove the one you do not mean to use"
            exit 1
          fi
          exit 0
        fi
        if [ -z "${!subscription:-}${!key:-}" ]; then
          case "$AGENT" in
            claude) runner="set $subscription or $key in the runner's environment" ;;
            codex) runner="run \`codex login\` as the runner's user, or set $key in its environment" ;;
          esac
          echo "::error::neither $subscription nor $key is set for $AGENT; run \`project init --ci-review\` to set one as a secret, or on a self-hosted runner, $runner"
          exit 1
        fi
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # -P keeps the caller's checkout, the working directory, off sys.path, so a repository with its own top-level
    # projector module cannot shadow this one. The agent runs `project` by name, so the shim goes on PATH.
    - name: Set up Projector
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/../..
        CONFIG: ${{ inputs.config }}
      run: |
        root=$(cd "$ACTION_ROOT" && pwd)
        bin="$RUNNER_TEMP/projector-bin"
        mkdir -p "$bin"
        printf '#!/bin/sh\nPYTHONPATH=%s/src exec python3 -P -m projector "$@"\n' "$(printf '%q' "$root")" > "$bin/project"
        chmod +x "$bin/project"
        echo "$bin" >> "$GITHUB_PATH"
        # Reviews name the Projector version that made them, and this source tree is installed as no distribution.
        # -I keeps the caller's checkout, the working directory, off sys.path, as -P does for the shim.
        version=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' \
          "$root/.claude-plugin/plugin.json")
        {
          echo "PROJECTOR_ROOT=$root"
          echo "PROJECTOR_VERSION=$version"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/projector-state"
        } >> "$GITHUB_ENV"
        git remote set-head origin --auto
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        if [ -n "$CONFIG" ]; then
          printf '%s\n' "$CONFIG" >> "$HOME/.projector.toml"
        fi
    # The app's token reaches only this repository, with the review's permissions. The key is an input, not a
    # caller's env, which would reach every step: a composite action's inputs set no environment variable, so
    # only this step, which reads the input, receives the key.
    - name: Mint the app's token
      id: app
      if: inputs.app-id != ''
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: read
        permission-pull-requests: write
        permission-issues: write
        permission-statuses: write
        permission-checks: read
        permission-actions: read
        permission-pages: read
    # The hosted service mints the app's token for the repository the job's OIDC token names, so this step holds
    # no key. A 402 or 403 fails the job with the service's words, such as where to subscribe.
    - name: Request the hosted service's token
      id: hosted
      if: inputs.app != ''
      shell: bash
      env:
        APP: ${{ inputs.app }}
        APP_ID: ${{ inputs.app-id }}
      run: |
        PYTHONPATH="$PROJECTOR_ROOT/src" python3 -P -c \
          'import sys; from projector import hosted; sys.exit(hosted.review_token_step())'
    # The context repositories a review reads, from the committed .projector.toml as Projector reads it, from the
    # default branch, so a pull request cannot widen what its own review's clone token reaches. An installation
    # token reaches one account's repositories, so only those of this repository's owner are listed.
    - name: Read the context repositories
      id: context
      if: inputs.step == 'review' && inputs.app-id != ''
      shell: bash
      run: |
        listed=$(project config get review.context_repos --default '')
        names=$(PYTHONPATH="$PROJECTOR_ROOT/src" python3 -P -c \
          'import sys; from projector import run; print(",".join(run.token_repositories(*sys.argv[1:])))' \
          "$GITHUB_REPOSITORY" "$listed")
        echo "repositories=$names" >> "$GITHUB_OUTPUT"
    # A token that only reads the context repositories, for `project review run` to check and clone them with. The
    # run keeps it out of the agent's environment, so the agent holds no token for them. It sets no `owner`,
    # which defaults to this repository's: an owner with no repositories would reach the whole installation.
    # GitHub refuses the whole token when the app cannot reach one listed repository, so a failure here leaves
    # the context out and the review goes on without it.
    - name: Mint the context token
      id: context-token
      if: steps.context.outputs.repositories != ''
      continue-on-error: true
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        repositories: ${{ steps.context.outputs.repositories }}
        permission-contents: read
    - name: Restore the review state
      if: inputs.step == 'review'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ runner.temp }}/projector-state/projector/reviews/loops
          ${{ runner.temp }}/projector-state/projector/reviews/prs
          !${{ runner.temp }}/projector-state/projector/reviews/prs/**/*.lock
        key: projector-review-${{ inputs.pr }}-${{ inputs.agent }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: projector-review-${{ inputs.pr }}-${{ inputs.agent }}-
    - name: Install the agent
      if: inputs.step == 'review'
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        CLAUDE_VERSION: ${{ inputs.claude-code-version }}
        CODEX_VERSION: ${{ inputs.codex-version }}
      run: |
        # A self-hosted runner can have the CLI installed already, where npm may not write.
        installed() {
          local found
          found=$("$1" --version 2>/dev/null | tr -s '[:space:]' ' ') || return 1
          [[ " $found " == *" $2 "* ]]
        }
        case "$AGENT" in
          claude)
            installed claude "$CLAUDE_VERSION" || npm install --global "@anthropic-ai/claude-code@$CLAUDE_VERSION"
            # Claude Code loads no plugin whose dependency is missing, and without Projector the agent has no
            # review-pr skill. This tree's marketplace pins each dependency. A runner that keeps ~/.claude between
            # jobs already has the plugin, which install leaves as it is, so update brings it to this tree's pin.
            claude plugin marketplace add "$PROJECTOR_ROOT"
            claude plugin install gh-stack@projector
            claude plugin update gh-stack@projector
            ;;
          codex)
            installed codex "$CODEX_VERSION" || npm install --global "@openai/codex@$CODEX_VERSION"
            if [ -z "${CODEX_AUTH_JSON:-}${OPENAI_API_KEY:-}" ]; then
              # The runner's own login, which the credential check found. Codex refreshes it in place, so the
              # job uses that home rather than a copy, and adds Projector's skills beside the runner's own.
              home="${CODEX_HOME:-$HOME/.codex}"
              mkdir -p "$home/skills"
              ln -sfn "$PROJECTOR_ROOT/skills" "$home/skills/projector"
              echo "CODEX_HOME=$home" >> "$GITHUB_ENV"
            else
              home="$RUNNER_TEMP/codex-home"
              mkdir -p "$home"
              ln -s "$PROJECTOR_ROOT/skills" "$home/skills"
              echo "CODEX_HOME=$home" >> "$GITHUB_ENV"
              if [ -n "${CODEX_AUTH_JSON:-}" ]; then
                (umask 077 && printf '%s' "$CODEX_AUTH_JSON" > "$home/auth.json")
              else
                printf '%s' "$OPENAI_API_KEY" | CODEX_HOME="$home" codex login --with-api-key
              fi
            fi
            ;;
        esac
    - name: Review the pull request
      if: inputs.step == 'review'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || steps.hosted.outputs.token || github.token }}
        PROJECTOR_TOKEN_LOGIN: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || steps.hosted.outputs.login || 'github-actions[bot]' }}
        # Only the review step hands its summary off; the summary job's publish pushes it.
        PROJECTOR_SUMMARY_HANDOFF: ${{ runner.temp }}/projector-summary
        # Outside /tmp, which Codex's sandbox lets the agent write.
        PROJECTOR_CONTEXT_DIR: ${{ runner.temp }}/context
        # Read only, for the run's clones; the run removes it from the agent's environment.
        PROJECTOR_CONTEXT_TOKEN: ${{ steps.context-token.outputs.token }}
        PROJECTOR_CONTEXT_MINT: ${{ steps.context-token.outcome }}
        PR: ${{ inputs.pr }}
        AGENT: ${{ inputs.agent }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        MODE: ${{ inputs.permission-mode }}
        REREVIEW: ${{ inputs.rereview }}
        TIMEOUT: ${{ inputs.timeout-minutes }}
      run: |
        if [ -z "$MODEL" ] && [ "$AGENT" = claude ]; then
          MODEL=claude-opus-5-5
        fi
        if [ -z "$MODEL" ]; then
          echo "::error::the $AGENT agent needs the model input"
          exit 1
        fi
        rereview=()
        if [ "$REREVIEW" = true ]; then
          rereview=(--rereview)
        fi
        project review run "$PR" --agent "$AGENT" --model "$MODEL" --effort "$EFFORT" --permission-mode "$MODE" \
          --timeout "$TIMEOUT" --loop actions --plugin-dir "$PROJECTOR_ROOT" "${rereview[@]}"
    - name: Save the review state
      if: always() && inputs.step == 'review'
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ runner.temp }}/projector-state/projector/reviews/loops
          ${{ runner.temp }}/projector-state/projector/reviews/prs
          !${{ runner.temp }}/projector-state/projector/reviews/prs/**/*.lock
        key: projector-review-${{ inputs.pr }}-${{ inputs.agent }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Hand the summary to the summary job
      if: success() && inputs.step == 'review'
      uses: actions/upload-artifact@v4
      with:
        name: projector-summary-${{ inputs.pr }}-${{ inputs.agent }}
        path: ${{ runner.temp }}/projector-summary
        retention-days: 1
        if-no-files-found: ignore
    - name: Download the summaries
      if: inputs.step == 'summary'
      uses: actions/download-artifact@v4
      with:
        pattern: projector-summary-${{ inputs.pr }}-*
        path: ${{ runner.temp }}/projector-summaries
    - name: Publish the summaries
      if: inputs.step == 'summary'
      shell: bash
      # The links post as the app when there is one. Its token cannot push, so the summaries ref goes up with the
      # checkout's own credentials and the site's rebuild event with the workflow's token.
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || steps.hosted.outputs.token || github.token }}
        PROJECTOR_TOKEN_LOGIN: ${{ steps.app.outputs.app-slug && format('{0}[bot]', steps.app.outputs.app-slug) || steps.hosted.outputs.login || 'github-actions[bot]' }}
        PROJECTOR_DISPATCH_TOKEN: ${{ github.token }}
        PR: ${{ inputs.pr }}
      run: |
        for folder in "$RUNNER_TEMP"/projector-summaries/*/; do
          [ -f "$folder/summary.json" ] || continue
          project summary publish --summary "$folder/summary.json" --diff "$folder/diff.patch" --pr "$PR"
        done
