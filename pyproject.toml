[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "projector-cli"
version = "0.5.8"
description = "Git-native project plans for people and coding agents"
readme = "README.md"
authors = [{ name = "Justin Balthrop" }]
license = "MIT"
requires-python = ">=3.11"

[project.scripts]
project = "projector.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
projector = ["templates/*.md", "site/assets/*"]
