name: Projector clean label

# Written by `project init`. Removes the `{label}` label when a commit is
# pushed, because the label says that Projector's newest review of the current
# head is clean, and a new head has no review yet. `pull_request_target` gives
# the token write access on a pull request from a fork; the job never checks
# out the pull request's code. The job-level `if` skips the job, so no runner
# starts, unless the pull request carried the label at the push.
#
# The event records the labels as they were at the push, and the job can run
# much later, after a slow queue or as a re-run, which replays the same event.
# So the step reads the pull request as it is when it runs, and keeps the label
# when the current head is already signed off: `project init` writes this
# workflow only where the default branch requires `{context}`, so a review
# that signs a head off posts that status as `success` on it.
on:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write
  statuses: read

jobs:
  unclean:
    if: contains(github.event.pull_request.labels.*.name, '{label}')
    runs-on: ubuntu-latest
    steps:
      - run: |
          now=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha + " " + ([.labels[].name | ascii_downcase] | any(. == "{label}") | tostring)')
          head=${now% *}
          if [ "${now#* }" != true ]; then
            echo "#$PR no longer carries {label}"
            exit 0
          fi
          status=$(gh api "repos/$REPO/commits/$head/status?per_page=100" --jq '.statuses[] | select(.context == "{context}") | .state')
          if [ "$status" = success ]; then
            echo "kept {label} on #$PR, because a review signed off its head ${head:0:7}"
            exit 0
          fi
          gh pr edit "$PR" --repo "$REPO" --remove-label {label}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
