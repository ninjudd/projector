name: Projector site
on:
  repository_dispatch:
    types: [projector-walkthroughs]
  push:
    branches: [main]
    # Rebuild when the action or the site code changes too, since this site
    # runs both from main.
    paths: [README.md, 'docs/**', 'actions/site/**', 'src/projector/**']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      - id: site
        # Projector's own site runs the action from main to preview unreleased
        # changes; `project site workflow` generates @v0 for other repositories.
        uses: ninjudd/projector/actions/site@main
